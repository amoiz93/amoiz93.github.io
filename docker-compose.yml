# this file uses prebuilt image in dockerhub
services:
  jekyll:
    image: amirpourmand/al-folio:v0.14.4
    build: .
    # uncomment these if you are having this issue with the build:
    # /usr/local/bundle/gems/jekyll-4.3.4/lib/jekyll/site.rb:509:in `initialize': Permission denied @ rb_sysopen - /srv/jekyll/.jekyll-cache/.gitignore (Errno::EACCES)
    # and fill the args values with the output of the commands on the right
    # build:
    #   args:
    #     GROUPID: # id -g
    #     GROUPNAME: # id -gn
    #     USERID: # id -u
    #     USERNAME: # echo $USER
    ports:
      - 8080:8080
      - 35729:35729
    volumes:
      - .:/srv/jekyll
      # Keep generated files off cloud-synced host filesystems.
      - type: volume
        source: jekyll_site
        target: /srv/jekyll/_site
        volume:
          nocopy: true
      - type: volume
        source: jekyll_cache
        target: /srv/jekyll/.jekyll-cache
        volume:
          nocopy: true
    environment:
      - JEKYLL_ENV=development

volumes:
  jekyll_site:
  jekyll_cache:
