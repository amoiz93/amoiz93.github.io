- title: Experience
  type: time_table
  contents:
    - title: Researcher & Development Engineer III (Hydrology & Water Resources)
      institution: "<strong><a href='https://ucsd.edu/' target='_blank'>University of California, San Diego</a></strong><br><a href='https://cw3e.ucsd.edu/' target='_blank'>Center for Western Weather and Water Extremes (CW3E)</a><br><a href='https://scripps.ucsd.edu/' target='_blank'>Scripps Institution of Oceanography</a>"
      year: 2025 - Present
      description:
        - Leading research on integrating snow hydrology, machine learning algorithms, and reservoir operations optimization to advance water resources management in snow-dominated watersheds of the western United States.
        - Actively conducting research on Forecast-Informed Reservoir Operations (FIRO) using ensemble forecasts for flood management during extreme events.
        - Contributing to peer-reviewed publications, technical deliverables, and presentations at scientific conferences and stakeholder-facing events.

    - title: Postdoctoral Research Scholar
      institution: "<strong><a href='https://www.asu.edu/' target='_blank'>Arizona State University</a></strong><br><a href='https://chi.engineering.asu.edu/' target='_blank'>Center for Hydrologic Innovations</a><br><a href='https://ssebe.engineering.asu.edu/' target='_blank'>School of Sustainable Engineering & Built Environment (SSEBE)</a>"
      year: 2023 - 2025
      description:
        - Led the multiscale performance benchmarking of NOAAs National Water Model (NWM) for high-intensity flood-producing precipitation events in arid and semi-arid basins, providing critical input to the Arizona Department of Water Resources for flood and recharge planning.
        - Designed a cloud-based database for managing and disseminating large, multi-source hydrologic and climate datasets among researchers and state agency partners.
        - Supported stakeholder engagement by translating complex model outputs into actionable insights for flood risk and water resources planning in the U.S. Southwest.

    - title: Technical Research Associate
      institution: "<strong><a href='http://www.u-tokyo.ac.jp/en/' target='_blank'>The University of Tokyo</a></strong><br><a href='https://global-hydrodynamics.github.io/' target='_blank'>Global Hydrodynamics Lab</a><br><a href='https://www.iis.u-tokyo.ac.jp/en/' target='_blank'>Institute of Industrial Science (IIS)</a>"
      year: 2023 - 2023
      description:
        - Contributed to the development of a data assimilation scheme for the CaMa-Flood model, a global hydrodynamic flood inundation model.
        - Contributed to the development of a benchmarking toolkit for CaMa-Flood model.

    - title: Project Researcher
      institution: "<strong><a href='http://www.u-tokyo.ac.jp/en/' target='_blank'>The University of Tokyo</a></strong><br><a href='https://ifi.u-tokyo.ac.jp/en/' target='_blank'>Institute for Future Initiatives (IFI)</a>"
      year: 2021 - 2023
      description:
        - Led the development of long-range (3-month) real-time hydrometeorological forecasting system for a snowfed watershed in Japan using a distributed hydrological model (WEB-DHM) and downscaled meteorological forecasts to support hydropower reservoir operations.
        - Led the development of new techniques for auto-correction of radar snow precipitation to improve hydrological modeling in snowfed mountainous watersheds.
        - Exploration of Integrated Assessment Model output datasets for developing policies to steward the global commons and limit climate change to 1.5C degree
        - Management of laboratory activities, partial supervision of graduate level students, writing academic articles and presenting in scientific conferences

    - title: Project Researcher
      institution: "<strong><a href='http://www.u-tokyo.ac.jp/en/' target='_blank'>The University of Tokyo</a></strong><br><a href='https://aqua.t.u-tokyo.ac.jp/en/' target='_blank'>River & Environmental Engineering Laboratory (REEL)</a><br><a href='https://www.t.u-tokyo.ac.jp/en/' target='_blank'>Department of Civil Engineering</a>"
      year: 2020 - 2021
      description:
        - Led the development of a hydrometeorological forecasting system (comprehensive data pipeline development from scratch) in Japan using gridded weather forecasts, radar observations, satellite observations and a distributed hydrological model using the state-of-the-art Data Integration and Analysis System (DIAS) at The University of Tokyo.
        - Dissemination of forecast information to the hydropower companies to support optimal operation of dams.
        - Performance assessment and improvement using parallel programming to support real-time decision-making.
        - Management of laboratory activities, partial supervision of graduate level students, writing academic articles and presenting in scientific conferences

    - title: Visiting Foreign Researcher
      institution: "<strong><a href='https://www.pwri.go.jp/eindex.html' target='_blank'>Public Works Research Institute (PWRI)</a></strong><br><a href='https://aqua.t.u-tokyo.ac.jp/en/' target='_blank'>River & Environmental Engineering Laboratory (REEL)</a><br><a href='https://www.t.u-tokyo.ac.jp/en/' target='_blank'>Department of Civil Engineering</a>"
      year: 2020 - 2021
