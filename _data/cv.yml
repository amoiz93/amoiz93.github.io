    - name: Current position
      value: Researcher (Hydrology & Water Resources)
    - name: Summary
      value: I am a hydrologist and water systems researcher focused on advancing climate-informed reservoir operations, flood risk management, and hydrologic forecasting. My work lies at the intersection of science, policy, and operations—developing novel decision support frameworks that integrate ensemble forecasting, snow hydrology, land surface modeling, and stakeholder-informed reservoir operations. Trained in Japan and currently based in California, I am passionate about building robust modeling and decision frameworks that improve water resilience under climate uncertainty.
    - name: Research Interests
      value: "• Catchment Hydrology<br>• Large-Scale Hydrology<br>• Snow Hydrology<br>• Hydrometeorological Forecasting<br>• Forecast Informed Reservoir Operation (FIRO)<br>• Dam Reservoir Operations<br>• Flood Risk Management"
